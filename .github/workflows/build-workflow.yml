name: Build
on:
  workflow_call:
    inputs:
      solution:
        description: 'The solution to build'
        default: ''
        required: false
        type: string
      new-test-runner:
        description: 'The test platform to use'
        default: false
        required: false
        type: boolean
      org:
        description: 'The organization to publish CI builds to'
        default: 'foundatiofx'
        required: false
        type: string
      feedz-feed:
        description: 'The Feedz account/feed path used for CI package publishing'
        default: 'foundatio/foundatio'
        required: false
        type: string
      compose-command:
        description: 'The docker compose command to run for tests'
        default: 'docker compose up -d && docker compose up ready || true'
        required: false
        type: string
      minimum-major-minor:
        description: 'Minimum major.minor version for MinVer (e.g. 8.0)'
        default: ''
        required: false
        type: string
    secrets:
      NUGET_KEY:
        required: false
      FEEDZ_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Build Reason
      run: |
        branch=${GITHUB_REF##*/}.
        if [[ "$branch" = "main." ]]; then
          branch=""
        elif [[ "$branch" = "master." ]]; then
          branch=""
        # Treat version maintenance branches (e.g., 7.x, 7.10, 8.x) as primary branches
        elif [[ "$branch" =~ ^[0-9]+\.(x|[0-9]+)\.$ ]]; then
          branch=""
        elif [[ "${GITHUB_REF}" = refs/tags* ]]; then
          branch=""
        elif [[ "${GITHUB_REF}" = refs/pull* ]]; then
          branch=""
        fi
        echo "GIT_BRANCH_SUFFIX=$branch" >> $GITHUB_ENV
        echo branch: $branch ref: $GITHUB_REF event: $GITHUB_EVENT_NAME actor: $GITHUB_ACTOR
    - name: Build Version
      env:
        MINIMUM_MAJOR_MINOR: ${{ inputs.minimum-major-minor }}
      run: |
        dotnet tool install --global minver-cli --version 8.0.0
        minver_args="--tag-prefix v --default-pre-release-identifiers preview.${GIT_BRANCH_SUFFIX}0"
        if [ -n "$MINIMUM_MAJOR_MINOR" ]; then
          minver_args="$minver_args --minimum-major-minor $MINIMUM_MAJOR_MINOR"
        fi
        version=$(minver $minver_args)

        # If on a non-main branch, insert branch name before the height (last numeric segment)
        if [ -n "$GIT_BRANCH_SUFFIX" ]; then
          branch_name="${GIT_BRANCH_SUFFIX%.}"
          if [[ "$version" != *"$branch_name"* ]]; then
            version=$(echo "$version" | sed -E "s/\.([0-9]+)$/.${GIT_BRANCH_SUFFIX}\1/")
          fi
        fi

        echo "MINVERVERSIONOVERRIDE=$version" >> $GITHUB_ENV
        echo "Version: $version"
        echo "### Version: $version" >> $GITHUB_STEP_SUMMARY
    - name: Set Default Solution
      id: slnx
      run: |
        if [ -z "${{ inputs.solution }}" ]; then
          slnx=$(find . -maxdepth 1 -name "*.slnx" | head -n 2)
          count=$(echo "$slnx" | wc -l)
          if [ "$count" -eq 1 ]; then
            file=$slnx
          else
            file="${{ inputs.solution }}"
          fi
        else
          file="${{ inputs.solution }}"
        fi
        echo "file=$file" >> $GITHUB_OUTPUT
    - name: Build
      run: dotnet build ${{ steps.slnx.outputs.file }} --configuration Release
    - name: Start Services
      if: hashFiles('docker-compose.yml') != ''
      run: ${{ inputs.compose-command }}
    - name: Run Tests
      env:
        DOTNET_DbgEnableMiniDump: '1'
        DOTNET_DbgMiniDumpType: '1'
        DOTNET_DbgMiniDumpName: ${{ runner.temp }}/crash/%e.%p.dmp
        DOTNET_EnableCrashReport: '1'
      run: |
        mkdir -p "${{ runner.temp }}/crash"
        sudo sysctl -q -w kernel.core_pattern="${{ runner.temp }}/crash/core.%e.%p" || true
        ulimit -c unlimited || true
        if [ "${{ inputs.new-test-runner }}" = "true" ]; then
          dotnet test --solution ${{ steps.slnx.outputs.file }} --configuration Release --no-build --report-github
        else
          dotnet test ${{ steps.slnx.outputs.file }} --configuration Release --no-build --logger GitHubActions
        fi
    - name: Show Test Host Crash Reports
      if: failure()
      run: |
        for report in "${{ runner.temp }}"/crash/*.crashreport.json; do
          [ -f "$report" ] || continue
          echo "::group::$(basename "$report")"
          jq -r '(.payload.threads | sort_by(.crashed != "true"))[] | "--- thread \(.native_thread_id) crashed=\(.crashed)", (.stack_frames[] | if .is_managed == "true" then "  \(.filename // "?")!\(.method_name // "?")" else "  \(.native_module // "?")!\(.unmanaged_name // .native_image_offset)" end)' "$report" || cat "$report"
          echo "::endgroup::"
        done
        sudo dmesg | grep -iE "segfault|traps:|general protection" | tail -20 || true
        for core in "${{ runner.temp }}"/crash/core.*; do
          [ -f "$core" ] || continue
          command -v gdb > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gdb > /dev/null; }
          exe=$(file -b "$core" | sed -n "s/.*execfn: '\([^']*\)'.*/\1/p")
          echo "::group::$(basename "$core") ($exe)"
          gdb -batch -ex "info sharedlibrary" -ex "bt 40" -ex "info threads" -ex "thread apply all bt 12" "$exe" "$core" 2>&1 | grep -v "^warning:" || true
          echo "::endgroup::"
        done
    - name: Package
      if: github.event_name != 'pull_request'
      run: dotnet pack ${{ steps.slnx.outputs.file }} --configuration Release --no-build
    - name: Publish CI Packages
      if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
      run: |
        for package in $(find . -name "*.nupkg" | grep -v "minver" | grep -v "/EmptyFiles/"); do

          # GitHub
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "${0##*/}": Pushing $package to GitHub...
            dotnet nuget push $package --source https://nuget.pkg.github.com/${{ inputs.org }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          fi

          # Feedz (remove once GitHub supports anonymous access)
          if [ -n "${{ secrets.FEEDZ_KEY }}" ]; then
            echo "${0##*/}": Pushing $package to Feedz...
            dotnet nuget push $package --source https://f.feedz.io/${{ inputs.feedz-feed }}/nuget --api-key ${{ secrets.FEEDZ_KEY }} --skip-duplicate
          fi

        done
    - name: Publish Release Packages
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        for package in $(find . -name "*.nupkg" | grep -v "minver" | grep -v "/EmptyFiles/"); do
          echo "${0##*/}": Pushing $package...
          dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_KEY }} --skip-duplicate
        done
